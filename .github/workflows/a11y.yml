# Accessibility audit on every push and PR (D-012). Informational: it does not
# gate Cloudflare deploys, which Workers Builds runs independently.
# The report goes to the run's job summary (no artifact upload: the account's
# artifact storage quota is shared and was full).
name: a11y
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run a11y
      - if: always()
        run: cat reports/a11y.md >> "$GITHUB_STEP_SUMMARY" || true
