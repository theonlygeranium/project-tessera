# Accessibility audit on every push and PR (D-012). Informational: it does not
# gate Cloudflare deploys, which Workers Builds runs independently.
name: a11y
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run a11y
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: reports/a11y.md
